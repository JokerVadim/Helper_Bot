database:
  spec:
    - id: bot_db
      storage:
        size GiB: 1

services:
  - type: web
    name: telegram-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TAVILY_KEY
        sync: false
      - key: GROQ_KEY
        sync: false
